[project]
name = "catan-bots"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catanatron>=3.2.1",
    "gymnasium>=1.3.0",
    "numpy>=2.4.6",
    "pettingzoo>=1.27.0",
    "sb3-contrib>=2.9.0",
    "stable-baselines3>=2.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catan_bots"]
